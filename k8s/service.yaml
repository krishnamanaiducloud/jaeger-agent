apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  labels:
    app.kubernetes.io/name: jaeger-agent
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: jaeger-agent
  ports:
    - name: zk-compact-trft
      port: 5775
      protocol: UDP
    - name: config-rest
      port: 5778
      protocol: TCP
    - name: jg-compact-trft
      port: 6831
      protocol: UDP
    - name: jg-binary-trft
      port: 6832
      protocol: UDP
